<svg viewBox="0 0 1000 30" xmlns="http://www.w3.org/2000/svg" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05d9e8" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#05d9e8"/>
      <stop offset="0.5" stop-color="#ff2a6d"/>
      <stop offset="0.8" stop-color="#05d9e8"/>
      <stop offset="1" stop-color="#05d9e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect x="0" y="0" width="1000" height="30"/></clipPath>
  </defs>
  <g filter="url(#g)">
    <rect x="0" y="14" width="1000" height="2" fill="url(#line)"/>
  </g>
  <g clip-path="url(#c)">
    <rect x="-150" y="13" width="150" height="4" fill="url(#pulse)" filter="url(#g)">
      <animate attributeName="x" from="-150" to="1000" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g filter="url(#g)">
    <rect x="492" y="7" width="16" height="16" fill="#0d0221" stroke="#fcee0a" stroke-width="2" transform="rotate(45 500 15)">
      <animate attributeName="stroke" values="#fcee0a;#ff2a6d;#05d9e8;#fcee0a" dur="3s" repeatCount="indefinite"/>
    </rect>
    <path d="M450 15 l-10 -6 v12 z" fill="#05d9e8"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M550 15 l10 -6 v12 z" fill="#ff2a6d"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></path>
  </g>
</svg>
