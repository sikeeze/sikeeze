<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="box" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity="0.25"/>
    </pattern>
    <clipPath id="l0"><rect x="30" y="62" width="0" height="26"><animate attributeName="width" values="0;0;80;80;0" keyTimes="0;0.02;0.08;0.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l1"><rect x="30" y="92" width="0" height="26"><animate attributeName="width" values="0;0;470;470;0" keyTimes="0;0.16;0.23;0.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="30" y="122" width="0" height="26"><animate attributeName="width" values="0;0;160;160;0" keyTimes="0;0.30;0.36;0.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="30" y="152" width="0" height="26"><animate attributeName="width" values="0;0;490;490;0" keyTimes="0;0.44;0.52;0.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="30" y="182" width="0" height="26"><animate attributeName="width" values="0;0;80;80;0" keyTimes="0;0.58;0.64;0.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l5"><rect x="30" y="212" width="0" height="26"><animate attributeName="width" values="0;0;350;350;0" keyTimes="0;0.72;0.79;0.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- Jendela -->
  <g filter="url(#box)">
    <rect x="8" y="8" width="784" height="264" rx="10" fill="#0a0314" stroke="#05d9e8" stroke-width="2">
      <animate attributeName="stroke" values="#05d9e8;#ff2a6d;#05d9e8" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="8" y="8" width="784" height="34" rx="10" fill="#1a0b2e"/>
  <rect x="8" y="30" width="784" height="12" fill="#1a0b2e"/>
  <circle cx="30" cy="25" r="6" fill="#ff2a6d"/>
  <circle cx="52" cy="25" r="6" fill="#fcee0a"/>
  <circle cx="74" cy="25" r="6" fill="#05d9e8"/>
  <text x="400" y="30" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#9a8bb5">sikeeze@neon-city: ~</text>

  <!-- Baris yang mengetik -->
  <g font-family="'Courier New', Courier, monospace" font-size="17" filter="url(#glow)">
    <text x="30" y="80" fill="#fcee0a" clip-path="url(#l0)">$ whoami</text>
    <text x="30" y="110" fill="#05d9e8" clip-path="url(#l1)">&gt; sikeeze // full-stack &amp; blockchain agent dev</text>
    <text x="30" y="140" fill="#fcee0a" clip-path="url(#l2)">$ cat stack.txt</text>
    <text x="30" y="170" fill="#05d9e8" clip-path="url(#l3)">&gt; Rust | Full-Stack | Blockchain | AI Agents</text>
    <text x="30" y="200" fill="#fcee0a" clip-path="url(#l4)">$ status</text>
    <text x="30" y="230" fill="#39ff14" clip-path="url(#l5)">&gt; ONLINE :: open for collaboration</text>
  </g>

  <!-- Kursor -->
  <rect x="30" y="248" width="10" height="18" fill="#ff2a6d">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanline -->
  <rect x="8" y="8" width="784" height="264" rx="10" fill="url(#scan)"/>
</svg>
