<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.55" stop-color="#2b0a3d"/>
      <stop offset="1" stop-color="#7a0a5a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcee0a"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0a3d"/>
      <stop offset="1" stop-color="#05010f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 L0 40" fill="none" stroke="#05d9e8" stroke-width="1.2" opacity="0.7"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 40" dur="1.5s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity="0.25"/>
    </pattern>
    <mask id="sunmask">
      <rect width="1000" height="320" fill="#fff"/>
      <rect x="380" y="150" width="240" height="3" fill="#000"/>
      <rect x="380" y="164" width="240" height="5" fill="#000"/>
      <rect x="380" y="180" width="240" height="7" fill="#000"/>
      <rect x="380" y="196" width="240" height="9" fill="#000"/>
    </mask>
  </defs>

  <!-- Langit -->
  <rect width="1000" height="320" fill="url(#sky)"/>

  <!-- Bintang berkedip -->
  <g fill="#fff">
    <circle cx="80" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="40" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="22" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="80" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Matahari neon -->
  <g filter="url(#glow)">
    <circle cx="500" cy="150" r="95" fill="url(#sun)" mask="url(#sunmask)">
      <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Skyline kiri -->
  <g fill="#12041f" stroke="#05d9e8" stroke-width="1" opacity="0.95">
    <rect x="0" y="145" width="55" height="70"/>
    <rect x="55" y="100" width="40" height="115"/>
    <rect x="95" y="155" width="65" height="60"/>
    <rect x="160" y="115" width="45" height="100"/>
    <rect x="205" y="160" width="60" height="55"/>
    <rect x="265" y="130" width="40" height="85"/>
    <rect x="305" y="165" width="50" height="50"/>
  </g>
  <!-- Skyline kanan -->
  <g fill="#12041f" stroke="#ff2a6d" stroke-width="1" opacity="0.95">
    <rect x="645" y="160" width="50" height="55"/>
    <rect x="695" y="115" width="40" height="100"/>
    <rect x="735" y="140" width="60" height="75"/>
    <rect x="795" y="95" width="45" height="120"/>
    <rect x="840" y="160" width="70" height="55"/>
    <rect x="910" y="125" width="40" height="90"/>
    <rect x="950" y="145" width="50" height="70"/>
  </g>
  <!-- Jendela berkedip -->
  <g>
    <rect x="65" y="115" width="6" height="6" fill="#fcee0a"><animate attributeName="opacity" values="1;0;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="78" y="135" width="6" height="6" fill="#05d9e8"><animate attributeName="opacity" values="0;1;0" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="172" y="130" width="6" height="6" fill="#ff2a6d"><animate attributeName="opacity" values="1;0;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="185" y="155" width="6" height="6" fill="#fcee0a"><animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="275" y="145" width="6" height="6" fill="#05d9e8"><animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="705" y="130" width="6" height="6" fill="#fcee0a"><animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="805" y="110" width="6" height="6" fill="#05d9e8"><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="820" y="140" width="6" height="6" fill="#ff2a6d"><animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="920" y="140" width="6" height="6" fill="#fcee0a"><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="745" y="155" width="6" height="6" fill="#05d9e8"><animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Tanah + grid bergerak -->
  <rect x="0" y="215" width="1000" height="105" fill="url(#ground)"/>
  <rect x="0" y="215" width="1000" height="105" fill="url(#grid)"/>
  <line x1="0" y1="215" x2="1000" y2="215" stroke="#ff2a6d" stroke-width="2" filter="url(#glow)"/>

  <!-- Teks utama dengan efek glitch -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="66" text-anchor="middle" letter-spacing="6">
    <text x="500" y="150" fill="#ff2a6d" opacity="0.8">
      SIKEEZE
      <animate attributeName="x" values="500;494;506;500;500;500;503;500" keyTimes="0;0.04;0.08;0.12;0.6;0.62;0.66;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="150" fill="#05d9e8" opacity="0.8">
      SIKEEZE
      <animate attributeName="x" values="500;506;494;500;500;500;497;500" keyTimes="0;0.04;0.08;0.12;0.6;0.62;0.66;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="150" fill="#ffffff" filter="url(#glow)">SIKEEZE</text>
  </g>

  <!-- Subjudul -->
  <text x="500" y="188" font-family="'Courier New', Courier, monospace" font-size="16" fill="#05d9e8" text-anchor="middle" letter-spacing="3" filter="url(#glow)">
    // FULL-STACK &amp; BLOCKCHAIN AGENT DEVELOPER
    <animate attributeName="opacity" values="1;1;0.4;1;1" keyTimes="0;0.8;0.85;0.9;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- HUD -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" fill="#fcee0a">
    <text x="20" y="28">&gt; SYSTEM ONLINE<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></text>
    <text x="980" y="28" text-anchor="end" fill="#ff2a6d">NEON CITY // 2077</text>
  </g>
  <g fill="none" stroke="#05d9e8" stroke-width="2" filter="url(#glow)">
    <path d="M8 40 V8 H40"/>
    <path d="M992 40 V8 H960"/>
    <path d="M8 280 V312 H40"/>
    <path d="M992 280 V312 H960"/>
  </g>

  <!-- Scanlines + garis scan bergerak -->
  <rect width="1000" height="320" fill="url(#scan)"/>
  <rect x="0" y="0" width="1000" height="6" fill="#fff" opacity="0.07">
    <animateTransform attributeName="transform" type="translate" from="0 -10" to="0 330" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
